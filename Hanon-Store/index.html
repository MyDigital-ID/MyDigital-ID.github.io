<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="/Hanon-Store/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>HANON STORE | حنون</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&family=Lalezar&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===== Splash Screen ===== -->
<div id="splashScreen" class="splash-screen">
  <div class="splash-content">

    <p class="splash-tagline">خامات و جوده و ذوق مضمون</p>
    <p class="splash-sub">أناقة بلا حدود</p>
  </div>
</div>

<!-- ===== Top Social Bar ===== -->
<div class="social-bar">
  <a href="#" id="facebookLink" class="social-icon" target="_blank" aria-label="Facebook">

    </svg>
  </a>
  <a href="#" id="whatsappLink" class="social-icon" target="_blank" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>

  </a>
</div>

<!-- ===== Header ===== -->
<header class="site-header">
  <div class="header-row">
    <button id="menuBtn" class="icon-btn" aria-label="menu">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>

    <div class="brand" id="brandHome">
      <span class="brand-logo">حنون</span>
      <span class="brand-en">HANON STORE</span>
    </div>

    <button id="cartBtn" class="icon-btn cart-btn" aria-label="cart">
      🛒<span id="cartCount" class="cart-count">0</span>
    </button>
  </div>
</header>

<!-- ===== Side Menu ===== -->
<div id="sideOverlay" class="overlay"></div>
<aside id="sideMenu" class="side-menu">
  <button id="closeMenu" class="icon-btn close-btn">✕</button>
  <nav class="side-nav">
    <a href="#" class="side-link" data-nav="home">الرئيسية</a>
    <a href="#" class="side-link" data-nav="about">عنا</a>
    <a href="#" class="side-link" data-nav="contact">تواصل معنا</a>
  </nav>

  <div id="aboutBox" class="side-box hidden">
    <p class="side-title">عن حنون</p>
    <p id="aboutText"></p>
    <p class="side-motto">هدفنا إرضائكم</p>
  </div>

  <div id="contactBox" class="side-box hidden">
    <p class="side-title">تواصل معنا</p>
    <a id="contactFacebook" class="wa-link" href="#" target="_blank">
      📘 فيسبوك
    </a>
    <a id="contactWhatsapp" class="wa-link" href="#" target="_blank">
      💬 واتساب
    </a>
  </div>
</aside>

<main id="app">

  <!-- ===== HOME VIEW ===== -->
  <section id="view-home" class="view">
    
    <!-- Banner -->
    <div class="hero-box">
      <div class="hero-content">
        <h1 class="hero-brand">حنون</h1>
        <p class="hero-tagline">خامات و جوده و ذوق مضمون</p>
      </div>
    </div>

    <!-- Slider 1: صور الأقسام -->
    <div class="slider-section">
      <h2 class="slider-title">✨ الأقسام</h2>
      <div class="slider-track" id="catsSlider"></div>
    </div>

    <!-- Slider 2: صور مميزة -->
    <div class="slider-section">
      <h2 class="slider-title">⭐ صور مميزة</h2>
      <div class="slider-track" id="featuredSlider"></div>
    </div>

    <!-- Vertical Categories List -->
    <div class="categories-list" id="categoriesList"></div>

  </section>

  <!-- ===== CATEGORY VIEW ===== -->
  <section id="view-category" class="view hidden">
    <button class="back-btn" id="backBtnCategory">→ رجوع للرئيسية</button>
    <h2 id="categoryTitle" class="category-title"></h2>
    <div id="productsList" class="products-list"></div>
  </section>

</main>

<!-- ===== Cart Drawer ===== -->
<div id="cartOverlay" class="overlay"></div>
<aside id="cartDrawer" class="cart-drawer">
  <div class="cart-header">
    <h3>🛒 سلة الطلبات</h3>
    <button id="closeCart" class="icon-btn close-btn">✕</button>
  </div>
  <div id="cartItems" class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>الإجمالي</span>
      <span id="cartTotal">0</span> <span>ج.م</span>
    </div>
    <button id="sendOrderBtn" class="cta-btn">إرسال الطلب عبر واتساب</button>
  </div>
</aside>

<!-- ===== Install Prompt ===== -->
<div id="installPrompt" class="install-prompt hidden">
  <p>ثبّت تطبيق حنون على شاشتك الرئيسية</p>
  <div class="install-actions">
    <button id="installNowBtn" class="cta-btn small">تثبيت الآن</button>
    <button id="installLaterBtn" class="pill-btn small">لاحقاً</button>
  </div>
</div>

<footer class="site-footer">
  <p>جميع الحقوق محفوظة لـ <strong>حنون</strong></p>
</footer>

<script src="site-data-loader.js"></script>
<script src="script.js"></script>

<!-- ===== Service Worker Registration ===== -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then((registration) => {
          console.log('✅ Service Worker registered:', registration.scope);
          
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            console.log('🔄 تحديث جديد متاح');
            
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('🎉 تحديث جديد جاهز — سيتم تطبيقه عند إعادة التحميل');
              }
            });
          });
        })
        .catch((err) => {
          console.warn('⚠️ Service Worker registration failed:', err);
        });
    });
  }
</script>
</body>
</html>
