<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم بيتزا مودي</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b120a; --card:#2b1e12; --gold:#d4a73c; --gold-soft:#e9c869;
    --ember:#e2703a; --cream:#f5ead9; --muted:#b8a488; --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--cream); font-family:'Tajawal',sans-serif; padding:20px;}
  h1{font-family:'Lalezar',cursive; color:var(--gold-soft); text-align:center;}
  .hidden{display:none !important;}
  .login-box{max-width:340px; margin:60px auto; background:var(--card); padding:24px; border-radius:14px; border:1px solid var(--gold);}
  input{width:100%; padding:12px; border-radius:8px; border:1px solid var(--gold); background:#231708; color:var(--cream); margin-bottom:12px; font-size:1rem;}
  button{cursor:pointer; border:none; border-radius:8px; padding:10px 16px; font-weight:700; font-family:inherit;}
  .btn-primary{background:var(--ember); color:#fff; width:100%;}
  .error{color:var(--danger); font-size:.85rem; margin-bottom:10px;}
  .zone-block{background:var(--card); border:1px solid rgba(212,167,60,.25); border-radius:12px; padding:16px; margin-bottom:20px;}
  .zone-block h2{color:var(--gold-soft); font-size:1.1rem; margin-top:0;}
  .item-edit{display:grid; grid-template-columns:1fr; gap:6px; background:#231708; border-radius:8px; padding:10px; margin-bottom:10px;}
  .item-edit .row{display:flex; gap:6px; flex-wrap:wrap;}
  .item-edit label{font-size:.75rem; color:var(--muted); display:block; margin-bottom:2px;}
  .item-edit input{margin-bottom:0;}
  .size-field{flex:1; min-width:90px;}
  .btn-remove{background:var(--danger); color:#fff; font-size:.75rem; align-self:flex-start;}
  .btn-add{background:var(--gold); color:#231708; margin-top:6px;}
  .save-bar{position:sticky; bottom:0; background:var(--bg); padding:14px 0; text-align:center; border-top:1px solid rgba(212,167,60,.25);}
  .save-bar button{width:100%; max-width:400px; padding:14px; font-size:1rem;}
  .save-msg{color:var(--gold-soft); text-align:center; margin-top:8px; display:none;}
  .top-bar{display:flex; justify-content:space-between; align-items:center; max-width:700px; margin:0 auto 10px;}
  a.back-site{color:var(--gold-soft); font-size:.85rem;}
  #dash{max-width:700px; margin:0 auto;}
  .top-row{display:flex; gap:8px; align-items:center;}
  .toggle-eye{background:none; border:1.5px solid var(--gold); padding:8px 10px; color:var(--cream); margin-bottom:12px;}
  #changeTokenBtn{background:var(--card); color:var(--gold-soft); border:1px solid var(--gold); margin-bottom:14px;}
</style>
</head>
<body>

<div id="loginView" class="login-box">
  <h1>لوحة تحكم بيتزا مودي</h1>
  <p style="font-size:.8rem;color:var(--muted);">الصق GitHub Token بتاعك (Fine-grained, Contents: Read & Write على ريبو البيتزا فقط)</p>
  <p id="loginError" class="error hidden">التوكن غير صحيح أو مفيهوش صلاحية</p>
  <div class="top-row">
    <input type="password" id="passInput" placeholder="ghp_xxxxxxxx" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="toggle-eye" id="togglePass">👁</button>
  </div>
  <button class="btn-primary" id="loginBtn">دخول</button>
</div>

<div id="dash" class="hidden">
  <div class="top-bar">
    <h1 style="margin:0;">لوحة تحكم بيتزا مودي</h1>
    <a class="back-site" href="index.html">↩ الموقع</a>
  </div>
  <button id="changeTokenBtn">🔑 تغيير التوكن</button>
  <div id="zonesContainer"></div>
  <div class="save-bar">
    <button class="btn-primary" id="saveAllBtn">حفظ كل التعديلات</button>
    <p class="save-msg" id="saveMsg">تم الحفظ ✅</p>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
