<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — أبو خميس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --wine:#3a1015; --charcoal:#170a0b; --ember:#e8762e; --gold:#c9a227; --smoke:#f4ebe1; --line:rgba(244,235,225,.15); }
  * { box-sizing: border-box; }
  body { font-family:'Cairo',sans-serif; background:var(--charcoal); color:var(--smoke); margin:0; padding:16px; }
  h1 { color:var(--ember); font-size:1.3rem; }
  h2 { color:var(--gold); font-size:1.05rem; margin-top:24px; border-bottom:1px solid var(--line); padding-bottom:6px; }
  input, textarea { width:100%; padding:8px; margin:4px 0 10px; background:#2a1013; border:1px solid var(--line); color:var(--smoke); border-radius:6px; font-family:inherit; }
  label { font-size:0.82rem; color:var(--smoke); opacity:0.85; }
  button { background:var(--ember); color:var(--charcoal); border:none; padding:10px 16px; border-radius:20px; font-weight:700; cursor:pointer; margin:4px 4px 4px 0; }
  button.secondary { background:transparent; border:1px solid var(--line); color:var(--smoke); }
  button.danger { background:#c1440e; color:var(--smoke); }
  .item-row { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; }
  .cat-block { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:16px; background:rgba(244,235,225,0.03); }
  #login-screen, #panel { max-width:640px; margin:0 auto; }
  #panel { display:none; }
  .status { font-size:0.85rem; padding:8px; border-radius:6px; margin:8px 0; }
  .status.ok { background:rgba(37,211,102,0.15); color:#25D366; }
  .status.err { background:rgba(193,68,14,0.2); color:#ff8a5c; }
  .row2 { display:flex; gap:8px; }
  .row2 > * { flex:1; }
  .tiers-block { margin-bottom:12px; }
  .tiers-block > label { display:block; font-weight:600; opacity:1; margin-bottom:6px; }
  .tier-row { display:flex; gap:8px; align-items:flex-start; margin-bottom:4px; }
  .tier-row > div { flex:1; }
  .hawawshi-item-row { display:flex; gap:8px; align-items:center; }
  .hawawshi-item-row input { margin:0; }
  .hawawshi-item-row button { flex:0 0 auto; margin:0; }
</style>
</head>
<body>

<div id="login-screen">
  <h1>لوحة تحكم مشويات أبو خميس</h1>
  <p>سجّل دخولك باستخدام GitHub Personal Access Token (صلاحية القراءة/الكتابة على الريبو فقط).</p>
  <label>GitHub Token</label>
  <div style="display:flex; gap:6px; align-items:center;">
    <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" style="flex:1;">
    <button type="button" class="secondary" onclick="toggleTokenVisibility()" style="white-space:nowrap;">👁 عرض</button>
  </div>
  <button onclick="login()">دخول</button>
  <div id="login-status"></div>
</div>

<div id="panel">
  <h1>لوحة التحكم</h1>
  <button class="secondary" onclick="changeToken()">🔑 تغيير التوكن</button>
  <button onclick="saveAll()">💾 حفظ كل التعديلات</button>
  <div id="save-status"></div>

  <h2>بيانات المحل</h2>
  <label>اسم الموقع</label><input id="f-siteName">
  <label>نبذة عن المحل</label><textarea id="f-about" rows="3"></textarea>
  <label>رقم واتساب (بدون + أو مسافات، مثال 201285458781)</label><input id="f-whatsapp">
  <label>نص أيقونة الواتس</label><input id="f-whatsappCaption">
  <div class="row2">
    <div><label>خط العرض Lat</label><input id="f-lat"></div>
    <div><label>خط الطول Lng</label><input id="f-lng"></div>
  </div>

  <h2>الأقسام والأصناف</h2>
  <div id="categories-container"></div>
</div>

<script>
const OWNER = 'MyDigital-ID';
const REPO = 'MyDigital-ID.github.io';
const BRANCH = 'main';
const PATH = 'abo-khamis/data.json';

let TOKEN = localStorage.getItem('abu_khamis_gh_token') || '';
let DATA = null;
let FILE_SHA = null;

function apiHeaders() {
  return { 'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json' };
}

function toggleTokenVisibility() {
  const input = document.getElementById('token-input');
  input.type = input.type === 'password' ? 'text' : 'password';
}

async function login() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  TOKEN = t;
  try {
    await loadData();
    localStorage.setItem('abu_khamis_gh_token', TOKEN);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
  } catch (err) {
    document.getElementById('login-status').innerHTML = '<div class="status err">فشل الدخول: تأكد من التوكن وصلاحياته. ' + err.message + '</div>';
  }
}

function changeToken() {
  localStorage.removeItem('abu_khamis_gh_token');
  TOKEN = '';
  document.getElementById('panel').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
}

async function loadData() {
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=${BRANCH}`;
  const res = await fetch(url, { headers: apiHeaders() });
  if (!res.ok) throw new Error('تعذر تحميل data.json (' + res.status + ')');
  const json = await res.json();
  FILE_SHA = json.sha;
  const decoded = decodeURIComponent(escape(atob(json.content)));
  DATA = JSON.parse(decoded);
  renderForm();
}

function renderForm() {
  document.getElementById('f-siteName').value = DATA.siteName || '';
  document.getElementById('f-about').value = DATA.about || '';
  document.getElementById('f-whatsapp').value = DATA.whatsapp || '';
  document.getElementById('f-whatsappCaption').value = DATA.whatsappCaption || '';
  document.getElementById('f-lat').value = DATA.coordinates?.lat || '';
  document.getElementById('f-lng').value = DATA.coordinates?.lng || '';

  const container = document.getElementById('categories-container');
  container.innerHTML = DATA.categories.map((cat, ci) => renderCategoryBlock(cat, ci)).join('');
}

function renderCategoryBlock(cat, ci) {
  const tiersHtml = cat.type === 'hawawshi' ? renderTiersBlock(cat, ci) : '';
  const itemsHtml = (cat.items || []).map((item, ii) => renderItemRow(cat, ci, item, ii)).join('');
  const addBtn = cat.type === 'hawawshi'
    ? `<button type="button" class="secondary" onclick="addHawawshiItem(${ci})">+ إضافة صنف حواوشي</button>`
    : '';
  return `
    <div class="cat-block">
      <strong>${cat.icon ? cat.icon + ' ' : ''}${cat.title}</strong>
      ${tiersHtml}
      ${itemsHtml}
      ${addBtn}
    </div>
  `;
}

function renderTiersBlock(cat, ci) {
  const rows = (cat.tiers || []).map((tier, ti) => `
    <div class="tier-row">
      <div>
        <label>اسم المستوى</label>
        <input value="${tier.name}" onchange="updateTier(${ci},${ti},'name',this.value)">
      </div>
      <div>
        <label>السعر</label>
        <input type="number" value="${tier.price}" onchange="updateTier(${ci},${ti},'price',Number(this.value))">
      </div>
    </div>
  `).join('');
  return `<div class="tiers-block"><label>المستويات والأسعار (مشتركة لكل أصناف القسم)</label>${rows}</div>`;
}

function renderItemRow(cat, ci, item, ii) {
  if (cat.type === 'hawawshi') {
    return `
      <div class="item-row hawawshi-item-row">
        <input value="${item.name}" onchange="updateItem(${ci},${ii},'name',this.value)">
        <button type="button" class="danger" onclick="deleteItem(${ci},${ii})">حذف</button>
      </div>
    `;
  }
  return `
    <div class="item-row">
      <label>الاسم</label>
      <input value="${item.name}" onchange="updateItem(${ci},${ii},'name',this.value)">
      <label>السعر</label>
      <input type="number" value="${item.price ?? ''}" onchange="updateItem(${ci},${ii},'price',Number(this.value))">
    </div>
  `;
}

function updateItem(ci, ii, field, value) {
  DATA.categories[ci].items[ii][field] = value;
}

function updateTier(ci, ti, field, value) {
  DATA.categories[ci].tiers[ti][field] = value;
}

function addHawawshiItem(ci) {
  const cat = DATA.categories[ci];
  if (!cat.items) cat.items = [];
  const idBase = 'hawawshi-' + Date.now();
  cat.items.push({ id: idBase, name: 'صنف حواوشي جديد' });
  renderForm();
}

function deleteItem(ci, ii) {
  if (!confirm('تأكيد حذف هذا الصنف؟')) return;
  DATA.categories[ci].items.splice(ii, 1);
  renderForm();
}

async function saveAll() {
  DATA.siteName = document.getElementById('f-siteName').value;
  DATA.about = document.getElementById('f-about').value;
  DATA.whatsapp = document.getElementById('f-whatsapp').value;
  DATA.whatsappCaption = document.getElementById('f-whatsappCaption').value;
  DATA.coordinates = { lat: Number(document.getElementById('f-lat').value), lng: Number(document.getElementById('f-lng').value) };

  const statusEl = document.getElementById('save-status');
  statusEl.innerHTML = '<div class="status">جارِ الحفظ...</div>';
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2))));
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
    const res = await fetch(url, {
      method: 'PUT',
      headers: { ...apiHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'تحديث من لوحة التحكم', content, sha: FILE_SHA, branch: BRANCH })
    });
    if (!res.ok) throw new Error(await res.text());
    const json = await res.json();
    FILE_SHA = json.content.sha;
    statusEl.innerHTML = '<div class="status ok">تم الحفظ بنجاح ✅</div>';
  } catch (err) {
    statusEl.innerHTML = '<div class="status err">فشل الحفظ: ' + err.message + '</div>';
  }
}

if (TOKEN) {
  loadData().then(() => {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
  }).catch(() => { localStorage.removeItem('abu_khamis_gh_token'); TOKEN = ''; });
}
</script>
</body>
</html>
