<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="/Fashion-Store/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم FASHION GUIDE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D47A1;
    --bg-2: #1565C0;
    --panel: #ffffff;
    --panel-2: #F5F9FF;
    --border: #BBDEFB;
    --orange: #E67E22;
    --orange-dark: #D35400;
    --gold: #FFC107;
    --text: #1A2B4A;
    --text-muted: #5D6B85;
    --danger: #E74C3C;
    --success: #27AE60;
    --shadow: rgba(26, 43, 74, 0.15);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Tajawal', 'Cairo', sans-serif;
    background: linear-gradient(135deg, #E3F2FD, #BBDEFB, #64B5F6);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--text);
    padding: 12px;
  }
  
  /* ============ Header ============ */
  .admin-header {
    background: var(--panel);
    border: 3px solid var(--orange);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 6px 20px var(--shadow);
    position: sticky;
    top: 12px;
    z-index: 50;
  }
  
  .admin-header h1 {
    font-family: 'Cairo', sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--bg);
    letter-spacing: 1px;
    margin: 0;
  }
  
  .admin-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  
  /* ============ Buttons ============ */
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-weight: 900;
    font-size: 0.85rem;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  
  button:active { transform: scale(0.97); }
  
  .btn-primary {
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: #fff;
    box-shadow: 0 4px 12px rgba(230, 126, 34, 0.4);
  }
  
  .btn-secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 2px solid var(--border);
  }
  
  .btn-success {
    background: var(--success);
    color: #fff;
  }
  
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 2px solid var(--danger);
    padding: 6px 12px;
    font-size: 0.75rem;
  }
  
  .btn-add {
    background: transparent;
    color: var(--orange);
    border: 2px dashed var(--orange);
    width: 100%;
    padding: 12px;
    font-size: 0.9rem;
    margin-top: 10px;
  }
  
  .btn-add:hover {
    background: rgba(230, 126, 34, 0.1);
  }
  
  /* ============ Login ============ */
  .login-wrap {
    max-width: 400px;
    margin: 10vh auto;
    background: var(--panel);
    border: 3px solid var(--orange);
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 12px 40px var(--shadow);
  }
  
  .login-wrap h1 {
    font-family: 'Cairo', sans-serif;
    font-size: 1.4rem;
    color: var(--bg);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  
  .login-wrap .subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 20px;
    font-weight: 700;
  }
  
  .login-wrap input {
    width: 100%;
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.95rem;
    text-align: center;
    background: var(--panel-2);
    color: var(--text);
    margin-bottom: 12px;
  }
  
  .login-wrap input:focus {
    outline: none;
    border-color: var(--orange);
  }
  
  #loginErr {
    color: var(--danger);
    font-size: 0.85rem;
    margin-top: 10px;
    min-height: 20px;
    font-weight: 700;
  }
  
  /* ============ Main ============ */
  #dashboard {
    max-width: 900px;
    margin: 0 auto;
    display: none;
  }
  
  #dashboard.active { display: block; }
  
  /* ============ Cards ============ */
  .card {
    background: var(--panel);
    border: 3px solid var(--orange);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 6px 20px var(--shadow);
  }
  
  .card-title {
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    font-weight: 900;
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
  }
  
  .card-title .title-info {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    cursor: pointer;
  }
  
  .card-title .zone-icon {
    font-size: 1.3rem;
  }
  
  .card-title .toggle-chev {
    font-size: 0.9rem;
    transition: transform 0.2s;
    color: var(--text-muted);
  }
  
  .card-title .toggle-chev.open {
    transform: rotate(180deg);
  }
  
  .type-badge {
    font-size: 0.7rem;
    background: var(--panel-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    font-weight: 700;
  }
  
  .zone-body {
    display: none;
  }
  
  .zone-body.open { display: block; }
  
  /* ============ Form Fields ============ */
  label {
    display: block;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 4px;
    margin-top: 10px;
    font-weight: 900;
  }
  
  input[type=text],
  input[type=number],
  textarea {
    width: 100%;
    background: var(--panel-2);
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.9rem;
  }
  
  input:focus,
  textarea:focus {
    outline: none;
    border-color: var(--orange);
  }
  
  textarea {
    resize: vertical;
    min-height: 60px;
  }
  
  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  
  /* ============ Product Box ============ */
  .item-box {
    background: var(--panel-2);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-top: 12px;
    position: relative;
  }
  
  .item-box .item-num {
    position: absolute;
    top: 8px;
    left: 8px;
    background: var(--bg);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 900;
    padding: 3px 10px;
    border-radius: 8px;
  }
  
  .item-actions {
    display: flex;
    gap: 6px;
    position: absolute;
    top: 8px;
    right: 8px;
  }
  
  /* ============ Images Grid ============ */
  .images-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
    margin-top: 8px;
  }
  
  .img-thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 2px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--sky-light, #E3F2FD);
  }
  
  .img-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  
  .img-thumb .img-del {
    position: absolute;
    top: 4px;
    right: 4px;
    background: var(--danger);
    color: #fff;
    border: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 0.75rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
  }
  
  .img-add-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    aspect-ratio: 1 / 1;
    border: 2px dashed var(--orange);
    border-radius: 10px;
    background: rgba(230, 126, 34, 0.05);
    color: var(--orange);
    font-size: 1.4rem;
    cursor: pointer;
    font-weight: 900;
    transition: background 0.2s;
  }
  
  .img-add-btn:hover {
    background: rgba(230, 126, 34, 0.15);
  }
  
  .img-add-btn small {
    font-size: 0.65rem;
    font-weight: 700;
  }
  
  input[type="file"] { display: none; }
  
  /* ============ Sizes ============ */
  .size-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  
  .size-chip {
    background: #fff;
    color: var(--text);
    border: 2px solid var(--border);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.15s;
  }
  
  .size-chip:hover {
    border-color: var(--orange);
  }
  
  .size-chip.selected {
    background: var(--bg);
    color: #fff;
    border-color: var(--bg);
  }
  
  .selected-sizes {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    padding: 10px;
    background: #fff;
    border-radius: 10px;
    min-height: 40px;
  }
  
  .selected-size {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 900;
  }
  
  .selected-size .sz-del {
    background: var(--danger);
    color: #fff;
    border: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 0.7rem;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* ============ Status Toast ============ */
  #statusMsg {
    position: fixed;
    bottom: 16px;
    right: 16px;
    left: 16px;
    max-width: 420px;
    margin: 0 auto;
    background: #fff;
    border: 3px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    text-align: center;
    font-weight: 900;
    font-size: 0.9rem;
    display: none;
    z-index: 100;
    box-shadow: 0 10px 30px var(--shadow);
  }
  
  #statusMsg.show { display: block; }
  #statusMsg.ok { border-color: var(--success); color: var(--success); }
  #statusMsg.err { border-color: var(--danger); color: var(--danger); }
  #statusMsg.loading { border-color: var(--orange); color: var(--orange); }
  
  /* ============ Loading Overlay ============ */
  #loadingOverlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 71, 161, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    backdrop-filter: blur(4px);
  }
  
  #loadingOverlay.show { display: flex; }
  
  .loader {
    background: #fff;
    padding: 24px 32px;
    border-radius: 16px;
    text-align: center;
    border: 3px solid var(--orange);
  }
  
  .loader .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid var(--border);
    border-top-color: var(--orange);
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin 0.8s linear infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  .loader p {
    font-weight: 900;
    color: var(--bg);
    font-size: 0.95rem;
  }
  
  /* ============ Zone Visibility Toggle ============ */
  .vis-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 900;
    color: var(--text-muted);
    cursor: pointer;
    border: 2px solid var(--border);
    user-select: none;
  }
  
  .vis-toggle.on {
    background: rgba(39, 174, 96, 0.1);
    border-color: var(--success);
    color: var(--success);
  }
  
  .vis-toggle.off {
    background: rgba(231, 76, 60, 0.1);
    border-color: var(--danger);
    color: var(--danger);
  }
  
  /* ============ Save Bar ============ */
  .save-bar {
    position: sticky;
    bottom: 12px;
    background: var(--panel);
    border: 3px solid var(--orange);
    border-radius: 16px;
    padding: 12px;
    margin-top: 14px;
    box-shadow: 0 -6px 20px var(--shadow);
    z-index: 40;
  }
  
  .save-bar button {
    width: 100%;
    padding: 16px;
    font-size: 1rem;
  }
</style>
</head>
<body>

<!-- ============ Login Screen ============ -->
<div id="loginScreen" class="login-wrap">
  <h1>🎛️ لوحة تحكم FASHION GUIDE</h1>
  <p class="subtitle">أدخل رمز الدخول للتحكم في المنتجات</p>
  <input type="password" id="pwInput" placeholder="أدخل التوكن هنا" autocomplete="off">
  <button class="btn-primary" style="width:100%;" id="loginBtn">🔓 دخول</button>
  <div id="loginErr"></div>
  <p class="subtitle" style="margin-top:20px;font-size:0.75rem;">مشروع الهوية الرقمية لمطعم FASHION GUIDE</p>
</div>

<!-- ============ Loading Overlay ============ -->
<div id="loadingOverlay">
  <div class="loader">
    <div class="spinner"></div>
    <p id="loadingText">جاري التحميل...</p>
  </div>
</div>

<!-- ============ Dashboard ============ -->
<div id="dashboard">
  
  <header class="admin-header">
    <h1>🎛️ لوحة تحكم FASHION GUIDE</h1>
    <div class="admin-actions">
      <button class="btn-secondary" id="reloadBtn">↻ تحديث</button>
      <button class="btn-primary" id="saveBtn">💾 حفظ التعديلات</button>
      <button class="btn-secondary" id="logoutBtn">🔑 خروج</button>
    </div>
  </header>
  
  <!-- Config Section -->
  <div class="card">
    <div class="card-title">
      <span class="title-info">
        <span class="zone-icon">⚙️</span>
        <span>الإعدادات العامة</span>
      </span>
    </div>
    <div id="configFields"></div>
  </div>
  
  <!-- Zones -->
  <div id="zonesWrap"></div>
  
  <button class="btn-add" id="addZoneBtn" style="margin-bottom: 14px;">+ إضافة قسم جديد</button>
  
  <!-- Save Bar -->
  <div class="save-bar">
    <button class="btn-primary" id="saveBtnBottom">💾 حفظ كل التعديلات</button>
  </div>
  
</div>

<div id="statusMsg"></div>

<script src="admin.js"></script>
</body>
</html>
